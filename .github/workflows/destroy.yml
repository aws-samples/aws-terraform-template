name: Destroy

permissions: {}

on:
  workflow_dispatch:

# Destroys in the reverse order of deployment. Each destroy plan waits for the
# GitHub environment's approval before it's applied, if the environment has
# required reviewers.
jobs:
  destroy-prod:
    name: Prod
    # The reusable workflow's jobs request these permissions, so the calling
    # job must grant all of them.
    permissions:
      contents: read # Required for actions/checkout
      id-token: write # Required to request the GitHub OIDC token
      pull-requests: write # Required to comment the plan on pull requests
      deployments: write # Required to mark deployments inactive after a destroy
    uses: aws-samples/aws-terraform-reusable-workflow/.github/workflows/terraform-reusable.yml@185fe37eb3dc1fb4bcfa6b67dffcbb3eea483a61 # feature/v2-saved-plan-s3-backend, replace with the v2.0.0 release
    with:
      deploy: false
      tf-version: ${{ vars.TF_VERSION }}
      aws-region: us-east-2
      environment: prod
    secrets:
      terraform-execution-iam-plan-role-arn: ${{ secrets.PROD_AWS_PLAN_ROLE_ARN }}
      terraform-execution-iam-apply-role-arn: ${{ secrets.PROD_AWS_APPLY_ROLE_ARN }}
      plan-encryption-key: ${{ secrets.PLAN_ENCRYPTION_KEY }}

  destroy-test:
    name: Test
    # The reusable workflow's jobs request these permissions, so the calling
    # job must grant all of them.
    permissions:
      contents: read # Required for actions/checkout
      id-token: write # Required to request the GitHub OIDC token
      pull-requests: write # Required to comment the plan on pull requests
      deployments: write # Required to mark deployments inactive after a destroy
    needs: destroy-prod
    uses: aws-samples/aws-terraform-reusable-workflow/.github/workflows/terraform-reusable.yml@185fe37eb3dc1fb4bcfa6b67dffcbb3eea483a61 # feature/v2-saved-plan-s3-backend, replace with the v2.0.0 release
    with:
      deploy: false
      tf-version: ${{ vars.TF_VERSION }}
      aws-region: us-west-2
      environment: test
    secrets:
      terraform-execution-iam-plan-role-arn: ${{ secrets.TEST_AWS_PLAN_ROLE_ARN }}
      terraform-execution-iam-apply-role-arn: ${{ secrets.TEST_AWS_APPLY_ROLE_ARN }}
      plan-encryption-key: ${{ secrets.PLAN_ENCRYPTION_KEY }}

  destroy-dev:
    name: Dev
    # The reusable workflow's jobs request these permissions, so the calling
    # job must grant all of them.
    permissions:
      contents: read # Required for actions/checkout
      id-token: write # Required to request the GitHub OIDC token
      pull-requests: write # Required to comment the plan on pull requests
      deployments: write # Required to mark deployments inactive after a destroy
    needs: destroy-test
    uses: aws-samples/aws-terraform-reusable-workflow/.github/workflows/terraform-reusable.yml@185fe37eb3dc1fb4bcfa6b67dffcbb3eea483a61 # feature/v2-saved-plan-s3-backend, replace with the v2.0.0 release
    with:
      deploy: false
      tf-version: ${{ vars.TF_VERSION }}
      aws-region: us-east-1
      environment: dev
    secrets:
      terraform-execution-iam-plan-role-arn: ${{ secrets.DEV_AWS_PLAN_ROLE_ARN }}
      terraform-execution-iam-apply-role-arn: ${{ secrets.DEV_AWS_APPLY_ROLE_ARN }}
      plan-encryption-key: ${{ secrets.PLAN_ENCRYPTION_KEY }}
