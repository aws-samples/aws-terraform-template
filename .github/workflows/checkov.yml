name: Checkov

permissions: {}

on:
  workflow_dispatch:
  pull_request:

jobs:
  scan:
    name: Checkov Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout
      security-events: write # Required to upload SARIF results
      actions: read # Required by upload-sarif in private repositories
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          config_file: .checkov.yaml
      # Upload the results whether or not checks failed. Failed checks fail the
      # previous step, and GitHub skips later steps by default.
      - name: Upload SARIF file
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
