name: Checkov

permissions: {}

on:
  workflow_dispatch:
  pull_request:

jobs:
  scan:
    name: Checkov Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout
      security-events: write # Required to upload SARIF results
      actions: read # Required by upload-sarif in private repositories
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          config_file: .checkov.yaml
      # Upload the results whether or not checks failed. Failed checks fail the
      # previous step, and GitHub skips later steps by default. Code scanning is
      # available in public repositories, and in private or internal
      # repositories only with GitHub Code Security enabled, so those opt in
      # with the CODE_SCANNING_ENABLED variable. Without the upload, the results
      # are in the Run Checkov step's log.
      - name: Upload SARIF file
        if: >-
          (success() || failure()) &&
          (github.event.repository.visibility == 'public' || vars.CODE_SCANNING_ENABLED == 'true')
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
