version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so that a compromised release
    # that is caught and pulled within days never reaches this repository.
    cooldown:
      default-days: 7

  # Proposes provider upgrades within the version constraints and updates the
  # dependency lock file.
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
